<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000408" />
    <meta name="description" content="OMCXXIII SENTINEL VR-OS — SOVEREIGN CORE RUNTIME" />
    
    <title>OMCXXIII // SENTINEL VR-OS — SOVEREIGN RUNTIME</title>

    <link rel="stylesheet" href="./css_sentinel_tokens.css" />
    <link rel="stylesheet" href="./css_sentinel_core.css" />
    <link rel="stylesheet" href="./css_sentinel_fx.css" />
    <link rel="stylesheet" href="./css_sentinel_hud.css" />

    <link rel="stylesheet" href="./attention-system.css.css" />
    <link rel="stylesheet" href="./render-hierarchy.css.css" />
    <link rel="stylesheet" href="./cognitive-layout.css.css" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body class="performance-lock">

    <div id="sentinel-root">
        
        <a-scene sentinel-runtime-scene embedded="false">
            
            <a-assets timeout="5000"></a-assets>

            <a-entity id="sentinel-rig" position="0 0 0">
                <a-camera id="sentinel-camera" look-controls="enabled: true" wasd-controls="enabled: false">
                    <a-cursor id="sentinel-reticle"
                              raycaster="objects: [sentinel-base-entity]; interval: 50;"
                              position="0 0 -1"
                              geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.015;"
                              material="shader: flat; color: #D4AF37; opacity: 0.8;"
                              animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 100; from: 0.1 0.1 0.1; to: 1 1 1"
                              animation__fusing="property: scale; startEvents: fusing; easing: easeOutQuad; dur: 800; from: 1 1 1; to: 0.1 0.1 0.1"
                              animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeOutQuad; dur: 400; to: 1 1 1">
                    </a-cursor>
                </a-camera>
            </a-entity>

            <a-entity id="sentinel-core-display"
                      sentinel-base-entity="actionId: core-diagnostic-node; latencyThreshold: 80;"
                      geometry="primitive: plane; width: 2.2; height: 1.4;"
                      material="shader: sentinel-cyber-glass; glowColor: #D4AF37;"
                      position="0 1.5 -2.5">
            </a-entity>
            
        </a-scene>

        <div id="sentinel-viewport" class="cognitive-transition layer-sovereign">
            <div id="hud-top-bar" class="hud-box">
                <div class="sys-id">SENTINEL-NEXUS-v9.0</div>
                <div id="clock-display" class="temporal-sync">00:00:00:00</div>
            </div>
            
            <div id="boot-sequence-container" class="glass-panel layer-focus">
                <div id="boot-sequence-label" class="pulse-glow">BOOT_SEQUENCE // STANDBY</div>
            </div>
        </div>
        
    </div>

    <script type="module" src="./sentinel-bus.js"></script>
    <script type="module" src="./sentinel-core.js"></script>
    <script type="module" src="./sentinel-kernel.js"></script>

    <script type="module" src="./sentinel-performance.js"></script>
    <script type="module" src="./sentinel-attention.js"></script>
    <script type="module" src="./sentinel-memory.js"></script>
    <script type="module" src="./sentinel-neurograph.js"></script>
    <script type="module" src="./sentinel-renderer.js"></script>
    <script type="module" src="./sentinel-debug-hud.js"></script>
    <script type="module" src="./js_sentinel_protocols.js"></script>

    <script type="module" src="./xr-shaders-core-shader-runtime.js"></script>
    <script type="module" src="./xrentitiescorebase.entity.js"></script>
    <script type="module" src="./xr/scenes/core/runtime.scene.js"></script>

    <script type="module">
        /**
         * Ponto de Inicialização Único do Sistema.
         * Aciona o Barramento de forma limpa, garantindo a Ordem Soberana 
         * de resolução do Grafo de Dependências sem loops inline concorrentes.
         */
        window.addEventListener('DOMContentLoaded', async () => {
            const label = document.getElementById('boot-sequence-label');
            
            try {
                if (label) label.innerHTML = 'BOOT_SEQUENCE // INITIATING_KERNEL';

                // Verifica a existência do Kernel no escopo global estabilizado
                if (window.SovereignKernel && typeof window.SovereignKernel.boot === 'function') {
                    
                    // Executa handshake sequencial controlado (BOOT -> INIT -> READY)
                    const bootSuccess = await window.SovereignKernel.boot();
                    
                    if (bootSuccess) {
                        // Desbloqueia as travas de renderização e CSS da viewport de hardware
                        document.body.classList.remove('performance-lock');
                        
                        if (label) {
                            label.innerHTML = 'SYSTEM_ONLINE // SOVEREIGN_RUNTIME_ACTIVE';
                            label.style.color = 'var(--battery-optimal, #00ff88)';
                        }
                        console.log('%c[BOOT] SENTINEL Bootstrap nominal concluído com sucesso.', 'color: #00FF88; font-weight: bold;');
                    } else {
                        throw new Error('O Kernel retornou falha durante a execução das fases de inicialização.');
                    }
                    
                } else {
                    throw new Error('Sovereign Kernel Runtime Subsystem Component Not Found.');
                }
                
            } catch (err) {
                console.error('[BOOT:FATAL_COLLAPSE]', err);
                if (label) {
                    label.innerHTML = 'BOOT FAILURE // CRITICAL RECOVERY REQUIRED';
                    label.style.color = 'var(--battery-critical, #ff3e3e)';
                }
            }
        });
    </script>
</body>
</html>
