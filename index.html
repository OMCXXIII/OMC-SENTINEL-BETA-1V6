<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <title>OMC VR-OS | SENTINEL NEXUS v9.0 SOVEREIGN RUNTIME</title>

    <!-- ========================================================= -->
    <!-- IDENTIDADE VISUAL BASE / TOKENS SOBERANOS                 -->
    <!-- ========================================================= -->

    <link rel="stylesheet" href="./css_sentinel_tokens.css" />
    <link rel="stylesheet" href="./css_sentinel_core.css" />

    <!-- ========================================================= -->
    <!-- CAMADAS AVANÇADAS (MANTIDAS)                              -->
    <!-- ========================================================= -->

    <link rel="stylesheet" href="./css_sentinel_fx.css" />
    <link rel="stylesheet" href="./css_sentinel_hud.css" />

    <!-- NOVAS CAMADAS MODULARES -->
    <link rel="stylesheet" href="./attention-system.css.css" />
    <link rel="stylesheet" href="./render-hierarchy.css.css" />
    <link rel="stylesheet" href="./cognitive-layout.css.css" />

    <!-- ========================================================= -->
    <!-- META SISTEMA                                              -->
    <!-- ========================================================= -->

    <meta name="theme-color" content="#000408" />
    <meta
        name="description"
        content="OMCXXIII SENTINEL VR-OS Sovereign Cognitive Runtime"
    />

    <!-- ========================================================= -->
    <!-- BOOT CRÍTICO / CSS MINIMALISTA                            -->
    <!-- ========================================================= -->

    <style>
        :root {
            --threat-level: 0;
            --render-scale: 1;
            --system-temperature: 32;
            --ui-density: 1;
            --boot-progress: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000408;
        }

        body {
            opacity: 0;
            transition:
                opacity 0.8s ease,
                background 1.2s ease;
        }

        body.runtime-active {
            opacity: 1;
        }

        /* ===================================================== */
        /* ROOT SOBERANO                                         */
        /* ===================================================== */

        #sentinel-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            isolation: isolate;
        }

        /* ===================================================== */
        /* CONTAINER OPERACIONAL                                 */
        /* ===================================================== */

        #nexus-os {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 50px 1fr 50px;

            width: 100%;
            height: 100%;

            position: relative;

            opacity: 0;
            transform: scale(1.01);

            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
        }

        body.runtime-ready #nexus-os {
            opacity: 1;
            transform: scale(1);
        }

        /* ===================================================== */
        /* BOOT OVERLAY                                           */
        /* ===================================================== */

        #boot-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            z-index: 999999;

            background:
                radial-gradient(circle at center,
                rgba(0,255,180,0.08),
                rgba(0,0,0,0.98));

            backdrop-filter: blur(8px);

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        #boot-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-title {
            color: #d4af37;
            font-family: monospace;
            letter-spacing: 0.3rem;
            margin-bottom: 1rem;
        }

        .boot-status-line {
            color: #7fffd4;
            font-size: 0.75rem;
            font-family: monospace;
            opacity: 0.8;
        }

        .boot-progress-track {
            width: 320px;
            height: 4px;

            margin-top: 1.5rem;

            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .boot-progress-bar {
            width: calc(var(--boot-progress) * 1%);
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #00ffd0,
                    #d4af37
                );

            transition: width 0.4s ease;
        }
    </style>

    <!-- ========================================================= -->
    <!-- CONFIGURAÇÃO GRÁFICA DE COMPATIBILIDADE                  -->
    <!-- ========================================================= -->

    <script>
        window.SENTINEL_GRAPHICS_CONFIG = {

            webgl: {
                antialias: false,
                alpha: false,
                powerPreference: 'low-power',
                premultipliedAlpha: false,
                preserveDrawingBuffer: false,
                failIfMajorPerformanceCaveat: false
            },

            canvas2d: {
                enabled: true,
                renderScale: 0.75
            },

            performance: {
                maxFrameRate: 30,
                enablePostProcessing: false,
                shadowMap: false
            },

            runtime: {
                adaptiveScaling: true,
                lazyXR: true,
                adaptiveFX: true,
                runtimeGovernance: true
            }
        };

        (function sentinelGraphicsProbe() {

            const canvas = document.createElement('canvas');

            const gl =
                canvas.getContext(
                    'webgl',
                    window.SENTINEL_GRAPHICS_CONFIG.webgl
                ) ||
                canvas.getContext(
                    'experimental-webgl',
                    window.SENTINEL_GRAPHICS_CONFIG.webgl
                );

            if (!gl) {

                console.warn(
                    '[SENTINEL] WebGL indisponível. Fallback 2D ativado.'
                );

                window.SENTINEL_GRAPHICS_FALLBACK = true;

            } else {

                console.log(
                    '[SENTINEL] WebGL disponível com configurações de compatibilidade.'
                );

                window.SENTINEL_GRAPHICS_FALLBACK = false;
            }

        })();
    </script>

    <!-- ========================================================= -->
    <!-- A-FRAME                                                   -->
    <!-- ========================================================= -->

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

</head>

<body>

    <!-- ========================================================= -->
    <!-- ROOT SOBERANO                                             -->
    <!-- ========================================================= -->

    <div id="sentinel-root">

        <!-- ===================================================== -->
        <!-- BOOT OVERLAY                                          -->
        <!-- ===================================================== -->

        <div id="boot-overlay">

            <div class="boot-title">
                SENTINEL NEXUS v9.0
            </div>

            <div class="boot-status-line" id="boot-sequence-label">
                GOVERNANCE INITIALIZATION...
            </div>

            <div class="boot-progress-track">
                <div class="boot-progress-bar"></div>
            </div>

        </div>

        <!-- ===================================================== -->
        <!-- FX PIPELINE                                            -->
        <!-- ===================================================== -->

        <div id="fx-pipeline">

            <div class="gamma-sync-layer"></div>

            <div class="neural-field"></div>

            <div class="neural-scan-overlay"></div>

        </div>

        <!-- ===================================================== -->
        <!-- NEXUS OS                                               -->
        <!-- ===================================================== -->

        <div id="nexus-os">

            <!-- ================================================= -->
            <!-- TOPBAR                                            -->
            <!-- ================================================= -->

            <header id="topbar" class="overlay-system">

                <div class="sys-id">
                    SENTINEL NEXUS v9.0
                </div>

                <div id="gamma-heartbeat"></div>

                <div class="telemetry-compact">

                    FPS:
                    <span id="fps-counter">--</span>

                    LATENCY:
                    <span id="latency-value">--</span>

                </div>

            </header>

            <!-- ================================================= -->
            <!-- HUD LEFT                                          -->
            <!-- ================================================= -->

            <aside id="hud-left" class="layer-context">

                <div class="hud-box">

                    <div class="hud-label">
                        CLOCK ATC
                    </div>

                    <div
                        id="clock-display"
                        class="hud-value"
                    >
                        00:00:00
                    </div>

                </div>

                <div class="hud-box">

                    <div class="hud-label">
                        MENTAL BATTERY
                    </div>

                    <div
                        id="mental-battery"
                        class="hud-value"
                    >
                        100%
                    </div>

                    <div class="battery-track">
                        <div id="battery-fill"></div>
                    </div>

                </div>

                <div class="hud-box">

                    <div class="hud-label">
                        MISSION_LOCK
                    </div>

                    <div
                        id="mission-display"
                        class="hud-value"
                    >
                        STANDBY
                    </div>

                </div>

            </aside>

            <!-- ================================================= -->
            <!-- SCENE WRAPPER                                     -->
            <!-- ================================================= -->

            <main id="scene-wrapper">

                <a-scene
                    id="main-scene"
                    embedded
                    vr-mode-ui="enabled: false"
                    renderer="
                        antialias: false;
                        colorManagement: true;
                        alpha: false;
                    "
                    raycaster="
                        objects: .raycastable, [data-raycastable]
                    "
                >

                    <a-sky color="#000408"></a-sky>

                    <!-- ========================================= -->
                    <!-- ENTITIES                                  -->
                    <!-- ========================================= -->

                    <a-entity
                        id="window-alpha"
                        ghost-window="
                            label: ALPHA_NEXUS;
                            layer: focus
                        "
                        position="-2 1.6 -4"
                        class="raycastable"
                        data-raycastable
                    ></a-entity>

                    <a-entity
                        id="window-beta"
                        ghost-window="
                            label: BETA_NEXUS;
                            layer: context
                        "
                        position="0 1.6 -4.5"
                        class="raycastable"
                        data-raycastable
                    ></a-entity>

                    <a-entity
                        id="window-gamma"
                        ghost-window="
                            label: GAMMA_NEXUS;
                            layer: sovereign
                        "
                        position="2 1.6 -4"
                        class="raycastable"
                        data-raycastable
                    ></a-entity>

                    <a-entity
                        camera
                        look-controls
                        cursor="rayOrigin: mouse"
                    ></a-entity>

                </a-scene>

            </main>

            <!-- ================================================= -->
            <!-- HUD RIGHT                                         -->
            <!-- ================================================= -->

            <aside id="hud-right" class="layer-context">

                <div
                    class="hud-box"
                    style="flex-grow:1;"
                >

                    <div class="hud-label">
                        AI_NEXUS_OUTPUT
                    </div>

                    <div
                        id="nexus-display"
                        class="terminal-window"
                    >
                        INICIALIZANDO SOBERANIA...
                    </div>

                </div>

                <div class="hud-box terminal-container">

                    <div class="hud-label">
                        CORE_TERMINAL
                    </div>

                    <div id="terminal-log"></div>

                    <input
                        type="text"
                        class="cmd-input"
                        placeholder="SENTINEL_CMD >"
                        spellcheck="false"
                    >

                </div>

            </aside>

            <!-- ================================================= -->
            <!-- FOOTER                                            -->
            <!-- ================================================= -->

            <footer
                id="bottombar"
                class="overlay-sovereign"
            >

                <div id="boot-status">
                    KERNEL_INIT_PENDING
                </div>

                <div class="sys-signature">
                    OMCXXIII | SOVEREIGN CORE
                </div>

            </footer>

        </div>

    </div>

    <!-- ========================================================= -->
    <!-- BOOTSTRAP SOBERANO                                        -->
    <!-- ========================================================= -->

    <script type="module">

        import SovereignKernel from './sentinel-kernel.js';

        window.addEventListener('DOMContentLoaded', async () => {

            console.log(
                '[BOOT] Sovereign Runtime Bootstrap iniciado.'
            );

            try {

                await SovereignKernel.boot({

                    root: '#sentinel-root',

                    mode:
                        window.SENTINEL_GRAPHICS_FALLBACK
                        ? 'SAFE_MODE'
                        : 'SOVEREIGN'

                });

                document.body.classList.add('runtime-active');

                document.body.classList.add('runtime-ready');

                document
                    .getElementById('boot-overlay')
                    ?.classList.add('hidden');

                const status =
                    document.getElementById('boot-status');

                if (status) {

                    status.innerHTML =
                        window.SENTINEL_GRAPHICS_FALLBACK
                        ? 'SYSTEM_ONLINE // SAFE_MODE_ACTIVE'
                        : 'SYSTEM_ONLINE // SOVEREIGN_RUNTIME_ACTIVE';

                    status.style.color =
                        window.SENTINEL_GRAPHICS_FALLBACK
                        ? '#D4AF37'
                        : 'var(--green-flow)';
                }

                console.log(
                    '[BOOT] SENTINEL Runtime soberano operacional.'
                );

            } catch (err) {

                console.error(
                    '[BOOT:FATAL]',
                    err
                );

                const label =
                    document.getElementById(
                        'boot-sequence-label'
                    );

                if (label) {

                    label.innerHTML =
                        'BOOT FAILURE // RECOVERY REQUIRED';
                }
            }

        });

    </script>

    <!-- ========================================================= -->
    <!-- FAVICON                                                   -->
    <!-- ========================================================= -->

    <link
        rel="icon"
        href="data:image/svg+xml,
        <svg xmlns='http://www.w3.org/2000/svg'
        viewBox='0 0 100 100'>
        <rect fill='%23000408'
        width='100'
        height='100'/>
        <text
        x='50'
        y='60'
        font-size='80'
        fill='%23D4AF37'
        font-family='monospace'
        text-anchor='middle'
        dominant-baseline='central'>S</text>
        </svg>"
    />

</body>
</html>
