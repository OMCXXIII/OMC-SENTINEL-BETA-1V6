<script>
/* ════════════════════════════════════════════════════════
   SENTINEL NEXUS ENRICHMENT ENGINE - v6.6 UNIFIED (FINAL)
════════════════════════════════════════════════════════ */

// 1. ESTADO GLOBAL UNIFICADO
window.SENTINEL_RUNTIME = {
    mode: 'ALPHA',
    fps: 0,
    telemetry: { events: 0, memory: 0, latency: 0 },
    threatLevel: 0,
    cognitiveLoad: 0,
    multitaskingDetected: false
};

// 2. CLASSES DE ENGINE
class CognitiveTerminal {
    constructor() { this.el = document.getElementById('terminal-log'); }
    log(message, type = 'info') {
        if (!this.el) return;
        const line = document.createElement('div');
        line.className = `terminal-line ${type}`;
        line.innerHTML = `<span class="ts">${new Date().toLocaleTimeString('pt-BR')}</span><span class="msg">${message}</span>`;
        this.el.prepend(line);
    }
}
window.Terminal = new CognitiveTerminal();

class GammaHeartbeat {
    constructor() { this.interval = null; }
    start() {
        const node = document.getElementById('gamma-heartbeat');
        if(!node) return;
        this.interval = setInterval(() => {
            node.classList.add('heartbeat-active');
            setTimeout(() => node.classList.remove('heartbeat-active'), 200);
        }, 1200);
    }
}
window.GammaSync = new GammaHeartbeat();

// 3. ENGINES DE PERFORMANCE (Bypass de Erro)
class FPSTracker {
    constructor() {
        this.frames = 0;
        this.lastTime = performance.now();
        this.loop();
    }
    loop() {
        this.frames++;
        const now = performance.now();
        if (now >= this.lastTime + 1000) {
            window.SENTINEL_RUNTIME.fps = this.frames;
            this.frames = 0;
            this.lastTime = now;
            const fpsNode = document.getElementById('fps-counter');
            if (fpsNode) fpsNode.textContent = window.SENTINEL_RUNTIME.fps;
        }
        requestAnimationFrame(() => this.loop());
    }
}
window.FPS_ENGINE = new FPSTracker();

// 4. CONTEXT SWITCHER
const ContextProfiles = {
    ALPHA: { theme: '#00D4FF', mission: 'ENGENHARIA_HARDWARE' },
    BETA: { theme: '#FFD700', mission: 'MERCADO_IMOBILIARIO' },
    GAMMA: { theme: '#FF003C', mission: 'TACTICAL_COMMAND' }
};

function switchContext(profile) {
    const cfg = ContextProfiles[profile];
    if (!cfg) return;
    window.SENTINEL_RUNTIME.mode = profile;
    document.documentElement.style.setProperty('--accent-color', cfg.theme);
    document.querySelectorAll('.ctx-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[data-profile="${profile}"]`)?.classList.add('active');
    
    if (window.StateStore) {
        StateStore.set('ops.profile', profile);
    }
    Terminal.log(`CONTEXT_SWITCH::${profile}`, 'success');
}

// 5. EMERGENCY BOOT & HOTFIX (Unificado)
(function initSentinel() {
    console.log("%c[BOOT] Iniciando Sequência Sentinel...", "color: #00D4FF;");
    
    window.addEventListener('load', () => {
        // Injeta sinais de liberação
        window.SENTINEL_BOOTED = true;
        if (!window.StateStore) {
            window.StateStore = { set: () => {}, get: () => null };
        }

        // Inicializa Interfaces
        GammaSync.start();
        
        // Remove bloqueios de tela
        setTimeout(() => {
            document.body.style.opacity = "1";
            document.body.style.visibility = "visible";
            
            Terminal.log('SENTINEL_NEXUS_v6.6_ONLINE', 'success');
            switchContext('ALPHA');
            
            // Bypass para o erro de GPU detectado no log image_766611.png
            if (window.SentinelBus) {
                window.SentinelBus.emit('boot:complete', { status: 'STABLE' });
            }
        }, 800);
    });

    // Eventos de Interface
    document.querySelectorAll('.ctx-btn').forEach(btn => {
        btn.addEventListener('click', () => switchContext(btn.dataset.profile));
    });
})();
</script>
