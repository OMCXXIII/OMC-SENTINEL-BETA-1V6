<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <title>OMCXXIII // SENTINEL VR-OS — SOVEREIGN RUNTIME</title>

    <link rel="stylesheet" href="./css_sentinel_tokens.css" />
    <link rel="stylesheet" href="./css_sentinel_core.css" />
    <link rel="stylesheet" href="./css_sentinel_fx.css" />
    <link rel="stylesheet" href="./css_sentinel_hud.css" />

    <link rel="stylesheet" href="./attention-system.css.css" />
    <link rel="stylesheet" href="./render-hierarchy.css.css" />
    <link rel="stylesheet" href="./cognitive-layout.css.css" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="./sentinel-bus.js"></script>
    <script src="./sentinel-core.js"></script>
    <script src="./sentinel-kernel.js"></script>
    <script src="./sentinel-performance.js"></script>
    <script src="./sentinel-attention.js"></script>
    <script src="./sentinel-memory.js"></script>
    <script src="./sentinel-neurograph.js"></script>
    <script src="./sentinel-renderer.js"></script>
    <script src="./sentinel-debug-hud.js"></script>
    <script src="./sentinel-state-machine.js"></script>
    <script src="./js_sentinel_protocols.js"></script>
    <script src="./js_sentinel_engine-xr.js"></script>

    <meta name="theme-color" content="#000408" />
    <meta name="description" content="OMCXXIII SENTINEL VR-OS Sovereign Infrastructure Root Interface" />
</head>
<body class="fx-tier-high performance-normal pulvinar-mask-stable">

    <a-scene embedded vrmode-trigger="true" renderer="foveatedRendering: true; antialias: true;">
        
        <a-entity camera look-controls position="0 1.6 0">
            <a-entity cursor="fuse: false;" 
                      raycaster="objects: [data-raycastable]; interval: 100; far: 15; useWorldCoordinates: false;">
            </a-entity>
        </a-entity>
        
        <a-box data-raycastable 
               class="hud-trigger layer-focus cognitive-transition" 
               position="0 1 -3" 
               color="#D4AF37"
               scale="1 1 1">
        </a-box>

    </a-scene>

    <div id="boot-telemetry-layer" style="position: fixed; top: 20px; left: 20px; font-family: monospace; color: #00FF88; z-index: 99999; pointer-events: none;">
        <div id="boot-sequence-label">INITIATING VECTOR COGNITION OS...</div>
    </div>

    <script type="module">
        /**
         * Como os módulos do sistema operam sob escopo global IIFE/CMA encapsulados 
         * na janela (Window), a injeção assíncrona conserta a quebra de contrato.
         * Não usamos 'import SovereignKernel' pois sentinel-kernel.js expõe uma IIFE global.
         */
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Sincroniza barramento de dados nativo
                if (window.SentinelBus) {
                    window.SentinelBus.emit('boot:handshake', {
                        client: 'SENTINEL_NEXUS_UI',
                        version: '9.0-SOVEREIGN',
                        ts: Date.now()
                    });
                }

                // Dispara o boot interno assincronamente através do Kernel e das Máquinas de Estado
                if (window.SentinelKernel && typeof window.SentinelKernel.init === 'function') {
                    window.SentinelKernel.init();
                    
                    // Garante transição forçada para READY na máquina de estados soberana se disponível
                    if (window.SovereignStateGovernor && typeof window.SovereignStateGovernor.transitionTo === 'function') {
                        await window.SovereignStateGovernor.transitionTo('READY');
                    }
                } else {
                    throw new Error('Sovereign Kernel Runtime Subsystem Component Not Found.');
                }

                // Atualiza tela de carregamento de telemetria base
                const label = document.getElementById('boot-sequence-label');
                if (label) {
                    label.innerHTML = 'SYSTEM_ONLINE // SOVEREIGN_RUNTIME_ACTIVE';
                    label.style.color = 'var(--battery-optimal, #00ff88)';
                }

                console.log('%c[BOOT] SENTINEL Runtime soberano operacional e estável em conformidade WebXR.', 'color: #00FF88; font-weight: bold;');
            } catch (err) {
                console.error('[BOOT:FATAL_COLLAPSE]', err);
                const label = document.getElementById('boot-sequence-label');
                if (label) {
                    label.innerHTML = 'BOOT FAILURE // CRITICAL RECOVERY REQUIRED';
                    label.style.color = 'var(--battery-critical, #ff3e3e)';
                }
            }
        });
    </script>
</body>
</html>
